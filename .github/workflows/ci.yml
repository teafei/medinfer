name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: medinfer --backend mock benchmark --concurrency 4 --limit 6 --warmup 0 --output results/ci-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-smoke-${{ matrix.python-version }}
          path: results/ci-smoke.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medinfer:test .
      - run: docker run -d --name medinfer-test -p 127.0.0.1:8000:8000 -e MEDINFER_BACKEND=mock -e MEDINFER_API_KEY=ci-only-key medinfer:test
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs medinfer-test
          exit 1
      - run: curl --fail -H 'Authorization:Bearer ci-only-key' http://127.0.0.1:8000/v1/models
